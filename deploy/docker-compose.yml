# Fixed project name: volumes are allar_db_data / allar_uploads no matter which folder this file is in.
name: allar

services:
  mariadb:
    image: mariadb:12.3
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-time-zone=+00:00"]
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME:?Set DB_NAME}
      MARIADB_USER: ${DB_USER:?Set DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks: [internal]
  web:
    build: ../web
    image: allar-web:${APP_VERSION:-latest}
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://${DB_USER:?Set DB_USER}:${DB_PASSWORD:?Set DB_PASSWORD}@mariadb:3306/${DB_NAME:?Set DB_NAME}
      UPLOAD_DIR: /app/uploads
      TRUST_PROXY: ${TRUST_PROXY:-true}
    volumes:
      - uploads:/app/uploads
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    restart: unless-stopped
    mem_limit: 1536m
    networks: [internal]
  backup:
    build: ./backup
    image: allar-backup:${APP_VERSION:-latest}
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      DB_NAME: ${DB_NAME:?Set DB_NAME}
      DB_USER: ${DB_USER:?Set DB_USER}
      MYSQL_PWD: ${DB_PASSWORD:?Set DB_PASSWORD}
      BACKUP_TIME: ${BACKUP_TIME:-02:00}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      TZ: Asia/Bangkok
    volumes:
      - uploads:/uploads:ro
      - uploads:/restore-uploads
      - ./backups:/backups
    restart: unless-stopped
    networks: [internal]
  phpmyadmin:
    image: phpmyadmin:5.2.3
    profiles: ["tools"]
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      PMA_HOST: mariadb
      UPLOAD_LIMIT: 128M
    ports:
      - "127.0.0.1:${PMA_PORT:-8080}:80"
    restart: unless-stopped
    networks: [internal]
volumes:
  db_data:
  uploads:
networks:
  internal:
